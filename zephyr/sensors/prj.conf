# Nt needs C++17 with the full standard library; CONFIG_NT selects the rest.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NT=y

# The sensor drivers of Zephyr, and Nt Sensors on them. Name a sensor with a devicetree alias such as accel0 or
# ambient-temp0 (see the overlay in boards/), or set its device name as the identifier.
CONFIG_SENSOR=y
CONFIG_NT_SENSORS=y

# Nt allocates from the C library's heap, and its event loop runs on the main thread.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768
