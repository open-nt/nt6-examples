# The i.MX RT1170 EVK on a real network: the router hands the board its address.
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_NETMASK=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""

# The checks talk to the board itself over the loopback driver, which sits under this menu.
CONFIG_NET_DRIVERS=y

# Prints the leased address on the console.
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NET_CONFIG_LOG_LEVEL_INF=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y

# Receiving runs in the Ethernet interrupt.
CONFIG_ISR_STACK_SIZE=16384

# Small buffers, and many of them: a frame is spread over about a dozen.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=128

# TLS handshakes crash in mbedtls on this board (a call through a bad function pointer), so the TLS checks are left out for now.
CONFIG_NT_TLS=n

# The driver defaults (6 receive buffers, a 1600-byte receive thread) are too small for a busy LAN.
# CONFIG_ETH_NXP_ENET_RX_BUFFERS=16
# CONFIG_ETH_NXP_ENET_TX_BUFFERS=4
CONFIG_ETH_NXP_ENET_RX_THREAD_STACK_SIZE=4096

# The default stacks of the network threads (1 to 1.5 KB) are too small to run the TCP/IP stack with logging.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
