# Nt needs C++17 with the full standard library; CONFIG_NT selects the rest.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NT=y

# The codec over I2C and its samples over I2S (SAI1 on the i.MX RT1170), driven by Nt Multimedia, which Nt FM plays
# through.
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_NT_MULTIMEDIA=y
CONFIG_NT_FM=y

# Nt allocates from the C library's heap, and its event loop runs on the main thread.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_MAIN_STACK_SIZE=16384
# The stacks of the threads that Nt starts (CONFIG_NT_THREAD_STACK_SIZE each) come from the kernel heap: the audio
# engine of Nt Multimedia and the rendering thread of Nt FM.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_NT_THREAD_STACK_SIZE=16384
CONFIG_LOG=y
